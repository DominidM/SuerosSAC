<nav [class.scrolled]="isScrolled()">

    @if (isScrolled()) {
      <div class="logo">

      </div>
    }

    <div class="nav-island">
      <ul class="nav-links">
        <li><a (click)="scrollTo('inicio')">Inicio</a></li>
