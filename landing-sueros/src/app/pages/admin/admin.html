<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <img src="https://res.cloudinary.com/dxuk9bogw/image/upload/v1773168649/SG_wemo2k.png" alt="SueroHome" />
      <span>Admin</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
        <i class="pi pi-home"></i>
        Dashboard
      </a>
      <a routerLink="/admin/hero" routerLinkActive="active" class="nav-item">
        <i class="pi pi-images"></i>
        Slides Hero
      </a>
      <a routerLink="/admin/sueros" routerLinkActive="active" class="nav-item">
        <i class="pi pi-heart"></i>
        Sueros
      </a>
      <a routerLink="/admin/servicios" routerLinkActive="active" class="nav-item">
        <i class="pi pi-briefcase"></i>
        Servicios
      </a>
      <a routerLink="/admin/reclamaciones" routerLinkActive="active" class="nav-item">
        <i class="pi pi-book"></i>
        Reclamaciones
      </a>
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="nav-item">
        <i class="pi pi-arrow-left"></i>
        Ver sitio
      </a>
      <button class="nav-item btn-cerrar" (click)="cerrarSesion()">
        <i class="pi pi-sign-out"></i>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <div class="topbar-left">
        <div class="breadcrumbs">
          @for (crumb of breadcrumbs(); track $index; let last = $last) {
            <span class="crumb" [class.active]="last">{{ crumb }}</span>
            @if (!last) {
              <i class="pi pi-chevron-right crumb-sep"></i>
            }
          }
        </div>
      </div>

      <div class="topbar-right">
        <span class="topbar-email">{{ adminEmail() }}</span>
        <button class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión">
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>
</div>
