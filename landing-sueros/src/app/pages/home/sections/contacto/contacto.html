<section id="contacto" class="contacto">
  <h2 class="section-title">¿Como Consulto?</h2>

  <div class="content">
    <div class="text-side">
      <h3 class="reserva-titulo">Reserva Aquí</h3>
      <p class="reserva-texto">Comodidad de su hogar</p>

      <button class="btn-wsp" (click)="abrirWhatsapp()">
        <i class="pi pi-whatsapp"></i>
        Escríbenos al WhatsApp
      </button>

      <div class="pagos">
        <span class="pagos-titulo">Métodos de pago</span>
        <div class="pagos-lista">
          <div class="pago-chip efectivo">
            <i class="pi pi-wallet"></i>
            Efectivo
          </div>
          <div class="pago-chip yape">
            <img src="https://res.cloudinary.com/dxuk9bogw/image/upload/v1773175027/yape-app-seeklogo_drgcut.png" alt="Yape" />
            Yape
          </div>
          <div class="pago-chip plin">
            <img src="https://res.cloudinary.com/dxuk9bogw/image/upload/v1773175082/plin-seeklogo_njzsmg.png" alt="Plin" />
            Plin
          </div>
        </div>
      </div>

    </div>

    <div class="image-side">
      <img 
        src="https://res.cloudinary.com/dxuk9bogw/image/upload/v1773168940/03-de-abril-suero-fisiolgico_1_wmxxqb.jpg" 
        alt="Contacto SueroHome" 
      />
    </div>
  </div>
</section>
