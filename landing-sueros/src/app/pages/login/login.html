<section class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img src="https://res.cloudinary.com/dxuk9bogw/image/upload/v1773168649/SG_wemo2k.png" alt="SueroHome" />
      <h2>Administración</h2>
    </div>

    <form (ngSubmit)="ingresar()">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@ejemplo.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      @if (error) {
        <div class="error-msg">
          <i class="pi pi-exclamation-circle"></i>
          {{ error }}
        </div>
      }

      <button type="submit" class="btn-ingresar" [disabled]="loading">
        @if (loading) {
          <i class="pi pi-spin pi-spinner"></i> Ingresando...
        } @else {
          <i class="pi pi-sign-in"></i> Ingresar
        }
      </button>
    </form>

    <a class="btn-volver" routerLink="/">
      <i class="pi pi-arrow-left"></i> Volver al inicio
    </a>
  </div>
</section>
